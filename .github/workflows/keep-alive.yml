# Keeps the Render free-tier socket service awake.
#
# Render's free plan spins a web service down after 15 minutes without inbound
# traffic, which makes realtime chat / live tracking slow (~50s cold start).
# This workflow pings the socket service /health endpoint every few minutes so
# the idle timer keeps resetting - and wakes it up if it ever does fall asleep.
#
# One-time setup (repo settings):
#   Settings > Secrets and variables > Actions > New repository secret
#     Name: RENDER_SOCKET_URL
#     Value: https://rydex-socket-xxxx.onrender.com   (your Render socket URL)
name: Keep socket server awake

on:
  schedule:
    # Every 5 minutes. GitHub cron can lag a few minutes, so this leaves a
    # comfortable buffer against Render's 15-minute idle timeout.
    - cron: "*/5 * * * *"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping socket /health
        env:
          SOCKET_URL: ${{ secrets.RENDER_SOCKET_URL }}
        run: |
          if [ -z "$SOCKET_URL" ]; then
            echo "::notice::RENDER_SOCKET_URL secret is not set yet."
            echo "Add it in Settings > Secrets and variables > Actions (your Render socket URL)."
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$SOCKET_URL/health")
          echo "GET $SOCKET_URL/health -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Socket health check failed with HTTP $code"
            exit 1
          fi
